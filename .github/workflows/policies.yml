name: Policies

# kube-janitor-policies chart: policy unit tests, Helm render tests, and kind end-to-end tests.
# docs/specs/compatibility.md section 8; docs/specs/security-and-testing.md sections 6-7.

on:
  push:
    branches: [main]
    paths:
      - charts/kube-janitor-policies/**
      - tests/**
      - hack/**
      - .github/workflows/policies.yml
  pull_request:
    branches: [main]
    paths:
      - charts/kube-janitor-policies/**
      - tests/**
      - hack/**
      - .github/workflows/policies.yml

permissions:
  contents: read

concurrency:
  group: policies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-unit:
    name: Policy unit (kyverno test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - name: Install Kyverno CLI (pinned, checksum-verified)
        run: hack/install-tools.sh kyverno
      - name: kyverno test (delete suite, audit suite, negative control)
        run: tests/kyverno/run.sh

  chart-render:
    name: Chart render (Helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.22.1, v4.3.2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ matrix.helm }}
      - name: Python dependencies
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
      - name: helm lint
        run: helm lint --strict charts/kube-janitor-policies
      - name: Render tests H1-H11
        run: python3 tests/helm/test_chart.py
      - name: Shell scripts
        run: shellcheck -S warning hack/*.sh tests/kyverno/run.sh tests/e2e/run.sh

  e2e:
    name: End-to-end (kind ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34", "1.35", "1.36", "1.37"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # E11 renders the previous chart from origin/main
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - name: Install kind and Chainsaw (pinned, checksum-verified)
        run: hack/install-tools.sh kind chainsaw
      - name: Select the digest-pinned node image
        run: |
          . tests/versions.env
          var="KIND_NODE_$(echo '${{ matrix.k8s }}' | tr . _)"
          echo "K8S_IMAGE=${!var}" >> "$GITHUB_ENV"
      - name: Run end-to-end scenarios
        run: tests/e2e/run.sh
