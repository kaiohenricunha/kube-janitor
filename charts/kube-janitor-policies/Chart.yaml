apiVersion: v2
name: kube-janitor-policies
description: >-
  Kyverno DeletingPolicy pack that removes Kubernetes resources explicitly marked as
  temporary, after their expiry. Every pack is disabled by default; an enabled pack
  starts in audit mode.
