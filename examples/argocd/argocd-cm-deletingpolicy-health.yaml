# Kyverno 1.20.0 never sets status.conditionStatus.ready on DeletingPolicy (kyverno#18813), so
# Argo CD shows every DeletingPolicy as Degraded. Merge this key into argocd-cm until the fix
# ships. Do not derive health from lastExecutionTime: the first run can be minutes away.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.policies.kyverno.io_DeletingPolicy: |
    hs = {}
    if obj.metadata ~= nil and obj.metadata.generation ~= nil then
      hs.status = "Healthy"
      hs.message = "DeletingPolicy accepted (Ready is not reported by Kyverno 1.20)"
    else
      hs.status = "Progressing"
      hs.message = "Waiting for the API server"
    end
    return hs
