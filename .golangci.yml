version: "2"
run:
  go: "1.26"
linters:
  enable:
    - bodyclose
    - godot
    - misspell
    - noctx
    - prealloc
    - revive
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    godot:
      scope: toplevel
      period: true
      # Kubebuilder markers (for example "+groupName=janitor.io") must keep their exact text.
      exclude:
        - '^ ?\+'
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: false
        - name: error-return
          disabled: false
        - name: var-naming
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - godot
        path: _test\.go
      - linters:
          - all
        path: zz_generated
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
