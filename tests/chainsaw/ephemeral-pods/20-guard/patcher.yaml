apiVersion: v1
kind: ServiceAccount
metadata:
  name: patcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patcher
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patcher
subjects:
- kind: ServiceAccount
  name: patcher
