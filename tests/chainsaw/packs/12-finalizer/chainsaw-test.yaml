# E9: a foreign finalizer is respected. The opted-in expired ConfigMap gets a deletionTimestamp,
# stays Terminating, and keeps its finalizer; later runs skip it (condition not-terminating).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: finalizer
spec:
  timeouts:
    assert: 4m
    exec: 1m
  steps:
    - name: create
      try:
        - apply:
            file: configmap.yaml
    - name: terminating-with-finalizer-intact
      try:
        - assert:
            file: terminating-assert.yaml
        - sleep:
            duration: 2m10s
        - assert:
            file: terminating-assert.yaml
      finally:
        - script:
            content: kubectl -n $NAMESPACE patch configmap e9-held --type=merge -p '{"metadata":{"finalizers":null}}' || true
