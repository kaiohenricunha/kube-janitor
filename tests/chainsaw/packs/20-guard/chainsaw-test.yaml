# Metadata guard (spec security-and-testing section 4): E7, E8, E16c, G-FMT, G-PROT.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: metadata-guard
spec:
  timeouts:
    exec: 3m
  steps:
    - name: setup
      try:
        - apply:
            file: patcher.yaml
        - apply:
            file: target.yaml
    - name: e7-opt-in-without-delete-permission-denied
      try:
        - script:
            content: kubectl -n $NAMESPACE label pod g-target janitor.io/ephemeral=true --as=system:serviceaccount:$NAMESPACE:patcher
            check:
              ($error != null): true
              (contains($stderr, 'G-OPT')): true
    - name: e8-ttl-label-without-delete-permission-denied
      try:
        - script:
            content: kubectl -n $NAMESPACE label pod g-target cleanup.kyverno.io/ttl=1m --as=system:serviceaccount:$NAMESPACE:patcher
            check:
              ($error != null): true
              (contains($stderr, 'G-OPT')): true
    - name: unrelated-label-still-allowed
      try:
        - script:
            content: kubectl -n $NAMESPACE label pod g-target janitor.io/owner=e2e --as=system:serviceaccount:$NAMESPACE:patcher
            check:
              ($error): ~
    - name: e16c-ttl-label-in-protected-namespace-denied
      try:
        - script:
            content: kubectl -n kube-system run g-ks --image=registry.k8s.io/pause:3.10 --labels=cleanup.kyverno.io/ttl=1m --dry-run=server
            check:
              ($error != null): true
              (contains($stderr, 'G-NS')): true
    - name: invalid-expiry-date-denied
      try:
        - script:
            content: kubectl -n $NAMESPACE annotate pod g-target janitor.io/expires-at=2026-02-30T00:00:00Z
            check:
              ($error != null): true
              (contains($stderr, 'G-FMT')): true
    - name: year-0000-expiry-denied
      try:
        - script:
            # Outside CEL's timestamp range: timestamp() would fail every policy run (review fix).
            content: kubectl -n $NAMESPACE annotate pod g-target janitor.io/expires-at=0000-01-01T00:00:00Z
            check:
              ($error != null): true
              (contains($stderr, 'G-FMT')): true
    - name: authorized-opt-in-allowed
      try:
        - script:
            content: kubectl -n $NAMESPACE label pod g-target janitor.io/ephemeral=true janitor.io/protected=true && kubectl -n $NAMESPACE annotate pod g-target janitor.io/expires-at=2999-01-01T00:00:00Z
            check:
              ($error): ~
    - name: protection-removal-without-delete-permission-denied
      try:
        - script:
            content: kubectl -n $NAMESPACE label pod g-target janitor.io/protected- --as=system:serviceaccount:$NAMESPACE:patcher
            check:
              ($error != null): true
              (contains($stderr, 'G-PROT')): true
    - name: protection-annotation-removal-without-delete-permission-denied
      try:
        - script:
            # The legacy controller's annotation form protects too, so its removal is guarded.
            content: |
              set -e
              kubectl -n $NAMESPACE label pod g-target janitor.io/protected-
              kubectl -n $NAMESPACE annotate pod g-target janitor.io/protected=true
              kubectl -n $NAMESPACE annotate pod g-target janitor.io/protected- --as=system:serviceaccount:$NAMESPACE:patcher
            check:
              ($error != null): true
              (contains($stderr, 'G-PROT')): true
    - name: r27-namespace-scoped-delete-grant
      try:
        - script:
            content: |
              set -e
              for ns in g-ns-own g-ns-other; do kubectl create namespace $ns; done
              # Patch on both namespaces; delete only on g-ns-own (a RoleBinding inside it).
              kubectl -n g-ns-own create role ns-self --verb=get,patch,delete --resource=namespaces
              kubectl -n g-ns-own create rolebinding ns-self --role=ns-self --serviceaccount=$NAMESPACE:patcher
              kubectl -n g-ns-other create role ns-patch --verb=get,patch --resource=namespaces
              kubectl -n g-ns-other create rolebinding ns-patch --role=ns-patch --serviceaccount=$NAMESPACE:patcher
              kubectl label namespace g-ns-own janitor.io/ephemeral=true --as=system:serviceaccount:$NAMESPACE:patcher
              echo "own namespace opt-in allowed"
            check:
              ($error): ~
              (contains($stdout, 'own namespace opt-in allowed')): true
        - script:
            content: kubectl label namespace g-ns-other janitor.io/ephemeral=true --as=system:serviceaccount:$NAMESPACE:patcher
            check:
              ($error != null): true
              (contains($stderr, 'G-OPT')): true
      finally:
        - script:
            content: kubectl delete namespace g-ns-own g-ns-other --ignore-not-found --wait=false
