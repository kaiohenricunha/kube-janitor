# GitOps e2e fixture (tests/gitops/run.sh). Opted in and long expired on purpose: the pack must
# NOT delete it, because a GitOps controller manages it.
apiVersion: v1
kind: Pod
metadata:
  name: go2-pod
  labels:
    janitor.io/ephemeral: 'true'
  annotations:
    janitor.io/expires-at: '2000-01-01T00:00:00Z'
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: go2-config
  labels:
    janitor.io/ephemeral: 'true'
  annotations:
    janitor.io/expires-at: '2000-01-01T00:00:00Z'
data:
  k: v
