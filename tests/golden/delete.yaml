apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: kube-janitor-completed-jobs-retention
  labels:
    app.kubernetes.io/name: kube-janitor-policies
    app.kubernetes.io/instance: t
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0-dev"
    helm.sh/chart: kube-janitor-policies-0.1.0-dev
    janitor.io/pack: completed-jobs-retention
  annotations:
    policies.kyverno.io/description: >-
      kube-janitor completed-jobs-retention: deletes finished standalone jobs without ttlSecondsAfterFinished, in namespaces labeled janitor.io/job-retention=enabled, 168h after they finished.
spec:
  schedule: "*/10 * * * *"
  deletionPropagationPolicy: Background
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        resources: ["jobs"]
        operations: ["*"]
        scope: Namespaced
    objectSelector:
      matchExpressions:
        - key: janitor.io/protected
          operator: NotIn
          values: ["true"]
    namespaceSelector:
      matchLabels:
        janitor.io/job-retention: enabled
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - default
            - kyverno
        - key: janitor.io/protected
          operator: NotIn
          values: ["true"]
  variables:
    - expression: object.metadata.?labels.orValue({})
      name: labels
    - expression: object.metadata.?annotations.orValue({})
      name: annotations
    - expression: object.?status.?conditions.orValue([]).filter(c, (c.type == 'Complete'
        || c.type == 'Failed') && c.status == 'True')
      name: finishedConditions
    - expression: 'variables.finishedConditions.size() > 0 ? timestamp(variables.finishedConditions[0].lastTransitionTime)
        : timestamp(''9999-12-31T23:59:59Z'')'
      name: finishedAt
  conditions:
    - expression: '!has(object.metadata.deletionTimestamp)'
      name: not-terminating
    - expression: variables.labels[?'janitor.io/protected'].orValue('') != 'true' && namespaceObject.metadata.?labels.orValue({})[?'janitor.io/protected'].orValue('')
        != 'true'
      name: not-protected
    - expression: '!(object.metadata.namespace in [''kube-system'', ''kube-public'', ''kube-node-lease'',
        ''default'', ''kyverno''])'
      name: not-protected-namespace
    - expression: '!variables.annotations.exists(k, k == ''argocd.argoproj.io/tracking-id''
        || k.startsWith(''meta.helm.sh/'')) && !variables.labels.exists(k, k.startsWith(''kustomize.toolkit.fluxcd.io/'')
        || k.startsWith(''helm.toolkit.fluxcd.io/'') || k == ''app.kubernetes.io/instance''
        || k == ''argocd.argoproj.io/instance'') && variables.labels[?''app.kubernetes.io/managed-by''].orValue('''')
        != ''Helm'''
      name: no-known-manager
    - expression: object.metadata.?ownerReferences.orValue([]).size() == 0
      name: standalone
    - expression: '!has(object.spec.ttlSecondsAfterFinished)'
      name: no-native-ttl
    - expression: variables.finishedConditions.size() > 0
      name: finished
    - expression: time.now() > variables.finishedAt + duration('168h')
      name: retention-elapsed
