    app.kubernetes.io/instance: t
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0-dev"
    helm.sh/chart: kube-janitor-policies-0.1.0-dev
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["configmaps"]
        operations: ["CREATE", "UPDATE"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["namespaces"]
        operations: ["CREATE", "UPDATE"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        resources: ["jobs"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: touches-cleanup-metadata
      expression: "object.metadata.?labels.orValue({}).exists(k, k.startsWith('janitor.io/') || k == 'cleanup.kyverno.io/ttl') || object.metadata.?annotations.orValue({}).exists(k, k.startsWith('janitor.io/')) || (oldObject != null && (oldObject.metadata.?labels.orValue({}).exists(k, k.startsWith('janitor.io/') || k == 'cleanup.kyverno.io/ttl') || oldObject.metadata.?annotations.orValue({}).exists(k, k.startsWith('janitor.io/'))))"
  variables:
    - name: newOptIn
      expression: "object.metadata.?labels.orValue({})[?'janitor.io/ephemeral'].orValue('')"
    - name: oldOptIn
      expression: "oldObject == null ? '' : oldObject.metadata.?labels.orValue({})[?'janitor.io/ephemeral'].orValue('')"
    - name: newRetention
      expression: "object.metadata.?labels.orValue({})[?'janitor.io/job-retention'].orValue('')"
    - name: oldRetention
      expression: "oldObject == null ? '' : oldObject.metadata.?labels.orValue({})[?'janitor.io/job-retention'].orValue('')"
    - name: newTTL
      expression: "object.metadata.?labels.orValue({})[?'cleanup.kyverno.io/ttl'].orValue('')"
    - name: oldTTL
      expression: "oldObject == null ? '' : oldObject.metadata.?labels.orValue({})[?'cleanup.kyverno.io/ttl'].orValue('')"
    - name: newExpiry
      expression: "object.metadata.?annotations.orValue({})[?'janitor.io/expires-at'].orValue('')"
    - name: oldExpiry
      expression: "oldObject == null ? '' : oldObject.metadata.?annotations.orValue({})[?'janitor.io/expires-at'].orValue('')"
    - name: newProtected
      expression: "object.metadata.?labels.orValue({})[?'janitor.io/protected'].orValue('')"
    - name: oldProtected
      expression: "oldObject == null ? '' : oldObject.metadata.?labels.orValue({})[?'janitor.io/protected'].orValue('')"
    - name: lifecycleChanged
      expression: "(variables.newOptIn != '' && variables.newOptIn != variables.oldOptIn) || (variables.newTTL != '' && variables.newTTL != variables.oldTTL) || (variables.newExpiry != '' && variables.newExpiry != variables.oldExpiry) || (variables.newExpiry == '' && variables.oldExpiry != '' && variables.newOptIn != '')"
    - name: retentionChanged
      expression: "variables.newRetention != '' && variables.newRetention != variables.oldRetention"
    - name: protectionRemoved
      expression: "variables.oldProtected == 'true' && variables.newProtected != 'true'"
    - name: targetNamespace
      expression: "request.resource.resource == 'namespaces' ? object.metadata.name : request.namespace"
    - name: inProtectedNamespace
      expression: "variables.targetNamespace in ['kube-system', 'kube-public', 'kube-node-lease', 'default', 'kyverno']"
    - name: canDelete
      expression: "request.resource.resource == 'namespaces' ? authorizer.group('').resource('namespaces').namespace(object.metadata.name).name(object.metadata.name).check('delete').allowed() : authorizer.group(request.resource.group).resource(request.resource.resource).namespace(request.namespace).name(object.metadata.name).check('delete').allowed()"
    - name: canDeleteJobsHere
      expression: "authorizer.group('batch').resource('jobs').namespace(variables.targetNamespace).check('delete').allowed()"
    - name: expiryValid
      expression: "(variables.newExpiry.matches('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$') && int(variables.newExpiry.substring(8, 10)) <= (int(variables.newExpiry.substring(5, 7)) == 2 ? ((int(variables.newExpiry.substring(0, 4)) % 4 == 0 && (int(variables.newExpiry.substring(0, 4)) % 100 != 0 || int(variables.newExpiry.substring(0, 4)) % 400 == 0)) ? 29 : 28) : (int(variables.newExpiry.substring(5, 7)) in [4, 6, 9, 11] ? 30 : 31)))"
  validations:
    - expression: "!((variables.lifecycleChanged || variables.retentionChanged) && variables.inProtectedNamespace)"
      messageExpression: "'kube-janitor guard G-NS: cleanup metadata is not allowed in protected namespace ' + variables.targetNamespace + ' (protected: kube-system, kube-public, kube-node-lease, default, kyverno). Create the object in another namespace, for example: kubectl run ... -n <namespace>.'"
      reason: Forbidden
    - expression: "!variables.lifecycleChanged || variables.canDelete"
      messageExpression: "'kube-janitor guard G-OPT: only a principal allowed to delete ' + request.resource.resource + '/' + object.metadata.name + ' may set or change its cleanup metadata (janitor.io/ephemeral, janitor.io/expires-at, janitor.io/job-retention, cleanup.kyverno.io/ttl)'"
      reason: Forbidden
    - expression: "!variables.retentionChanged || variables.canDeleteJobsHere"
      messageExpression: "'kube-janitor guard G-OPT: only a principal allowed to delete Jobs in namespace ' + variables.targetNamespace + ' may set or change janitor.io/job-retention'"
      reason: Forbidden
    - expression: "!variables.protectionRemoved || variables.canDelete"
      messageExpression: "'kube-janitor guard G-PROT: only a principal allowed to delete ' + request.resource.resource + '/' + object.metadata.name + ' may remove janitor.io/protected=true'"
      reason: Forbidden
    - expression: "variables.newExpiry == '' || variables.newExpiry == variables.oldExpiry || variables.expiryValid"
      messageExpression: "'kube-janitor guard G-FMT: janitor.io/expires-at must be a real UTC date in the form YYYY-MM-DDTHH:MM:SSZ, got ' + variables.newExpiry"
      reason: Invalid
