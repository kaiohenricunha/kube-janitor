# Selector-bypass suite: tests/kyverno/run.sh renders the delete policy WITHOUT the opt-in
# selector line (STRIP in suite.env). The CEL conditions alone must still keep objects that
# did not opt in. Do not commit policy.yaml.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: completed-jobs-retention-no-selector
policies:
- policy.yaml
resources:
- ../completed-jobs-retention/resources.yaml
variables: ../completed-jobs-retention/values.yaml
results:
- isDeletingPolicy: true
  kind: Job
  policy: kube-janitor-completed-jobs-retention
  resources:
  - jobs-a/j18-complete-old
  result: pass
- isDeletingPolicy: true
  kind: Job
  policy: kube-janitor-completed-jobs-retention
  resources:
  - jobs-b/j22-no-retention-ns
  result: fail
